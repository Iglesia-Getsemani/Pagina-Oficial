<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Ministerio</title>
  <link rel="stylesheet" href="style.css">
<base target="_blank">
</head>
<body>

<header class="app-header">
  <button class="back-btn" onclick="navigate('index.html')">‹</button>
  <h1 id="ministryTitle">Ministerio</h1>
  <div class="header-actions">
    <button class="back-btn" id="switchMinBtn" onclick="openSwitchModal()" title="Cambiar ministerio">🔀</button>
  </div>
</header>

<div id="toast" class="toast"></div>
<button class="fab" id="mainFab" onclick="fabAction()">＋</button>

<main class="page">

  <!-- Tab bar: Reuniones · Participantes · Tareas -->
  <div style="display:flex; gap:0; background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-bottom:16px; overflow:hidden;">
    <button class="tab-btn active" id="tab-meetings"     onclick="switchTab('meetings')">📅 Reuniones</button>
    <button class="tab-btn"        id="tab-participants" onclick="switchTab('participants')">👥 Participantes</button>
    <button class="tab-btn"        id="tab-tasks"        onclick="switchTab('tasks')">✅ Tareas</button>
  </div>

  <!-- MEETINGS TAB -->
  <div id="tabMeetings">
    <div class="section-title">Próximas Reuniones</div>
    <div id="upcomingMeetingsList"></div>
    <div class="section-title">Historial</div>
    <div id="pastMeetingsList"></div>
  </div>

  <!-- PARTICIPANTS TAB -->
  <div id="tabParticipants" style="display:none;">
    <!-- Filtros de participantes eliminados (solo Todos) -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="search" id="pSearch" placeholder="Buscar participante..." oninput="renderParticipants()">
    </div>
    <div id="participantsList"></div>
  </div>

  <!-- TASKS TAB -->
  <div id="tabTasks" style="display:none;">
    <div style="display:flex; gap:6px; margin-bottom:12px; overflow-x:auto; padding-bottom:4px;">
      <div class="pill active" id="tf-all"     onclick="setTaskFilter('all')">Todas</div>
      <div class="pill"        id="tf-pending" onclick="setTaskFilter('pending')">⏳ Pendientes</div>
      <div class="pill"        id="tf-free"    onclick="setTaskFilter('free')">🕊️ Sin reunión</div>
      <div class="pill"        id="tf-done"    onclick="setTaskFilter('done')">✅ Completadas</div>
    </div>
    <div id="tasksList"></div>
  </div>

</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="index.html">
    <span class="nav-icon">🏠</span>
    <span>Inicio</span>
  </a>
  <a href="index.html">
    <span class="nav-icon">⭐</span>
    <span>Favoritos</span>
  </a>
  <a href="members.html">
    <span class="nav-icon">👥</span>
    <span>Miembros</span>
  </a>
  <a href="ministry.html" class="active" onclick="event.preventDefault(); openActiveMinistry();">
    <span class="nav-icon">📋</span>
    <span>Ministerio</span>
  </a>
  <a href="setup.html">
    <span class="nav-icon">⚙️</span>
    <span>Ajustes</span>
  </a>
</nav>

<!-- SWITCH MINISTRY MODAL -->
<div class="modal-overlay" id="switchModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Seleccionar Ministerio</div>
    <div id="switchMinList"></div>
    <button class="btn btn-ghost btn-block btn-sm" onclick="closeModal('switchModal')">Cancelar</button>
  </div>
</div>

<!-- ADD / EDIT MEETING MODAL -->
<div class="modal-overlay" id="meetingModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="meetingModalTitle">Nueva Reunión</div>
    <div class="input-group">
      <label>Título *</label>
      <input type="text" id="mTitle" placeholder="Ej: Reunión de planificación">
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div class="input-group">
        <label>Fecha *</label>
        <input type="date" id="mDate">
      </div>
      <div class="input-group">
        <label>Hora</label>
        <input type="time" id="mTime">
      </div>
    </div>
    <div class="input-group">
      <label>Lugar</label>
      <input type="text" id="mPlace" placeholder="Salón, templo...">
    </div>
    <div class="input-group">
      <label>Descripción</label>
      <textarea id="mDesc" placeholder="Tema o agenda..."></textarea>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-secondary" style="flex:1;" onclick="closeModal('meetingModal')">Cancelar</button>
      <button class="btn btn-primary"   style="flex:1;" onclick="saveMeeting()">Guardar</button>
    </div>
    <div id="deleteMeetingBtn" style="margin-top:8px; display:none;">
      <button class="btn btn-danger btn-block btn-sm" onclick="deleteMeeting()">🗑 Eliminar reunión</button>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════
     MEETING DETAIL MODAL
     Contiene: Info · Asistencia · Tareas de esta reunión
     ════════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="meetingDetailModal">
  <div class="modal-sheet" style="max-height:92vh; overflow-y:auto; padding-bottom:36px;">
    <div class="modal-handle"></div>

    <!-- Encabezado dinámico de la reunión -->
    <div id="mdHeader"></div>

    <!-- Sub-tabs del detalle -->
    <div style="display:flex; gap:0; background:var(--surface); border:1px solid var(--border); border-radius:10px; margin:14px 0 16px; overflow:hidden;">
      <button class="tab-btn active" id="mdt-info"       onclick="switchDetailTab('info')">📄 Info</button>
      <button class="tab-btn"        id="mdt-attendance" onclick="switchDetailTab('attendance')">📋 Asistencia</button>
      <button class="tab-btn"        id="mdt-dtasks"     onclick="switchDetailTab('dtasks')">✅ Tareas</button>
    </div>

    <!-- INFO -->
    <div id="mdtInfo"></div>

    <!-- ASISTENCIA -->
    <div id="mdtAttendance" style="display:none;">
      <div id="mdAttStats" style="margin-bottom:10px;"></div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="search" id="mdAttSearch" placeholder="Buscar..." oninput="renderDetailAttendance()">
      </div>
      <!-- Filtros de asistencia eliminados (solo Todos) -->
      <div id="mdAttList"></div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="mdMarkAll(true)">✓ Todos presentes</button>
        <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="mdMarkAll(false)">✗ Todos ausentes</button>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="saveMeetingAttendance()">💾 Guardar asistencia</button>
    </div>

    <!-- TAREAS de esta reunión -->
    <div id="mdtDtasks" style="display:none;">
      <div id="mdTasksList"></div>
      <button class="btn btn-secondary btn-block btn-sm" style="margin-top:8px;"
              onclick="requireDirector(() => openAddTaskForMeeting(currentDetailMeetingId))">＋ Nueva tarea</button>
    </div>

    <!-- Editar reunión (solo director) -->
    <div id="mdEditBtn" style="margin-top:16px; display:none;">
      <button class="btn btn-ghost btn-block btn-sm"
              onclick="closeModal('meetingDetailModal'); requireDirector(() => openEditMeeting(currentDetailMeetingId))">
        ✏️ Editar reunión
      </button>
    </div>
  </div>
</div>

<!-- ADD / EDIT TASK MODAL -->
<div class="modal-overlay" id="taskModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="taskModalTitle">Nueva Tarea</div>
    <div class="input-group">
      <label>Tarea *</label>
      <input type="text" id="tTitle" placeholder="Descripción de la tarea">
    </div>
    <div class="input-group">
      <label>Asignado a</label>
      <input type="text" id="tAssigned" placeholder="Nombre del responsable">
    </div>
    <div class="input-group">
      <label>Reunión asociada</label>
      <select id="tMeeting">
        <option value="">Sin reunión específica</option>
      </select>
    </div>
    <div class="input-group">
      <label>Fecha límite (opcional)</label>
      <input type="date" id="tDue">
    </div>
    <div class="input-group">
      <label>Notas</label>
      <textarea id="tNotes" placeholder="Detalles adicionales..."></textarea>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-secondary" style="flex:1;" onclick="closeModal('taskModal')">Cancelar</button>
      <button class="btn btn-primary"   style="flex:1;" onclick="saveTask()">Guardar</button>
    </div>
    <div id="deleteTaskBtn" style="margin-top:8px; display:none;">
      <button class="btn btn-danger btn-block btn-sm" onclick="deleteTask()">🗑 Eliminar tarea</button>
    </div>
  </div>
</div>

<style>
.tab-btn {
  flex: 1; padding: 10px 4px; border: none; background: transparent;
  font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700;
  color: var(--text-muted); cursor: pointer; transition: 0.2s;
  letter-spacing: 0.02em;
}
.tab-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

    .bottom-nav a { font-size: 9px; padding: 8px 2px 7px; }
    .bottom-nav a .nav-icon { font-size: 19px; }
  </style>

<script src="app.js"></script>
<script>
// ── Estado global ────────────────────────────────────────────────
let activeTab            = 'meetings';
let activeMinistryId     = null;
let pFilter              = 'all';
let taskFilter           = 'all';
let editingMeetingId     = null;
let editingTaskId        = null;

// Estado del modal de detalle de reunión
let currentDetailMeetingId = null;
let activeDetailTab        = 'info';
let mdAttFilter            = 'all';
let tempAttendance         = {}; // memberId → true | false | null

// ===== ARRANQUE =====
document.addEventListener('DOMContentLoaded', () => {
  const session = getSessionUser();
  if (!session) {
    document.querySelector('.page').style.visibility = 'hidden';
    requireAuth('ministry', () => window.location.reload());
    return;
  }

  const roles  = getUserRoles(session);
  const dirIds = roles.includes('director')  ? (session.dirMinistries || []) : [];
  const asiIds = roles.includes('asistente') ? (session.ministries    || []) : [];
  const allIds = [...new Set([...dirIds, ...asiIds])];

  if (allIds.length === 0) {
    document.getElementById('ministryTitle').textContent = 'Sin ministerio';
    document.querySelector('.page').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚙️</div>
        <h3>Sin ministerios asignados</h3>
        <p>Pide al administrador que te asigne ministerios.</p>
        <br>
        <button class="btn btn-primary" onclick="navigate('index.html')">Ir al inicio</button>
      </div>`;
    return;
  }

  activeMinistryId = DB.get('active_ministry', null);
  const isValidActive = activeMinistryId && allIds.includes(activeMinistryId);

  if (roles.includes('director') && dirIds.length > 1 && !isValidActive) {
    _showDirectorPicker(session, dirIds, asiIds, _boot);
    return;
  }

  if (!isValidActive) activeMinistryId = allIds[0];
  DB.set('active_ministry', activeMinistryId);
  _boot();
});

function _boot() {
  updateMinistryHeader();
  updateAccessBadge();
  renderMeetings();
  renderParticipants();
  renderTasks();
}

// ===== DIRECTOR PICKER =====
function _showDirectorPicker(session, dirIds, asiIds, onPicked) {
  document.querySelector('.page').style.visibility = 'hidden';
  document.getElementById('mainFab').style.display = 'none';

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay open';
  overlay.id = 'dirPickerOverlay';
  overlay.style.cssText = 'background:rgba(0,0,0,.85); z-index:500;';

  const dirSet = new Set(dirIds);
  const buildItem = (id, isDir) => {
    const m = getMinistry(id);
    return `
      <div class="list-item" style="cursor:pointer;" onclick="_pickMinistry('${id}')">
        <div class="avatar" style="font-size:20px;">${m.icon}</div>
        <div class="item-info">
          <div class="item-name">${m.name}</div>
          <div class="item-sub">${m.cat} · ${isDir
            ? '<span style="color:var(--gold);font-weight:700;">👑 Director</span>'
            : '<span style="color:var(--blue);">👤 Asistente</span>'}</div>
        </div>
        <div style="color:var(--gold);font-size:20px;">›</div>
      </div>`;
  };

  let itemsHtml = dirIds.map(id => buildItem(id, true)).join('');
  asiIds.filter(id => !dirSet.has(id)).forEach(id => { itemsHtml += buildItem(id, false); });

  overlay.innerHTML = `
    <div class="modal-sheet" style="padding-bottom:32px; max-height:80vh; overflow-y:auto;">
      <div class="modal-handle"></div>
      <div style="text-align:center; font-size:28px; margin-bottom:4px;">📋</div>
      <div class="modal-title" style="text-align:center; margin-bottom:4px;">¿Qué ministerio vas a administrar?</div>
      <p style="font-size:12px; color:var(--text-muted); text-align:center; margin-bottom:16px;">
        Hola ${session.name.split(' ')[0]}, selecciona el ministerio con el que quieres trabajar hoy.
      </p>
      <div>${itemsHtml}</div>
    </div>`;
  document.body.appendChild(overlay);
  window._onPickerSuccess = onPicked;
}

function _pickMinistry(id) { openMinistry(id); }

// ===== HEADER / BADGE / FAB =====
function updateMinistryHeader() {
  const m = getMinistry(activeMinistryId);
  document.getElementById('ministryTitle').textContent = m.icon + ' ' + m.name;
}

function updateAccessBadge() {
  const isDir = isDirectorOf(activeMinistryId);
  const fab   = document.getElementById('mainFab');
  fab.style.display = isDir ? '' : 'none';
  fab.textContent   = '📅';
}

function requireDirector(action) {
  const session = getSessionUser();
  if (!session) { showToast('Inicia sesión primero', 'error'); return; }
  if (!isDirectorOf(activeMinistryId)) {
    showToast('Solo el director puede realizar esta acción', 'error'); return;
  }
  action();
}

// ===== TABS PRINCIPALES =====
function switchTab(tab) {
  ['meetings', 'participants', 'tasks'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).style.display =
      t === tab ? 'block' : 'none';
  });
  activeTab = tab;

  const isDir = isDirectorOf(activeMinistryId);
  const fab   = document.getElementById('mainFab');
  if (isDir) {
    fab.style.display = (tab === 'meetings' || tab === 'tasks') ? '' : 'none';
    fab.textContent   = tab === 'tasks' ? '✅' : '📅';
  } else {
    fab.style.display = 'none';
  }
}

function fabAction() {
  if (activeTab === 'tasks')    requireDirector(openAddTask);
  else                          requireDirector(openAddMeeting);
}

// ===== SWITCH MINISTRY =====
function openSwitchModal() {
  const session = getSessionUser();
  const roles   = getUserRoles(session);
  const dirIds  = roles.includes('director')  ? (session.dirMinistries || []) : [];
  const asiIds  = roles.includes('asistente') ? (session.ministries    || []) : [];
  const dirSet  = new Set(dirIds);
  const allIds  = [...new Set([...dirIds, ...asiIds])];
  if (!allIds.length) allIds.push(...DB.get('my_ministries', []));

  document.getElementById('switchMinList').innerHTML = allIds.map(id => {
    const m = getMinistry(id);
    return `
      <div class="list-item ${id === activeMinistryId ? 'gold-border' : ''}" onclick="switchMinistry('${id}')">
        <div class="avatar">${m.icon}</div>
        <div class="item-info">
          <div class="item-name">${m.name}</div>
          <div class="item-sub">${dirSet.has(id)
            ? '<span style="color:var(--gold);font-weight:700;">👑 Director</span>'
            : '<span style="color:var(--blue);">👤 Asistente</span>'} · ${m.cat}</div>
        </div>
        ${id === activeMinistryId ? '<div style="color:var(--gold)">✓</div>' : ''}
      </div>`;
  }).join('');
  openModal('switchModal');
}

function switchMinistry(id) { closeModal('switchModal'); openMinistry(id); }

// ===== PARTICIPANTES =====
function getMinistryMembers() {
  return DB.get('members', []).filter(m =>
    (m.ministries || []).includes(activeMinistryId)
  );
}

function setPFilter(f) {
  pFilter = 'all';
  renderParticipants();
}

function renderParticipants() {
  let members = getMinistryMembers();
  const search = (document.getElementById('pSearch')?.value || '').toLowerCase();
  if (search) members = members.filter(m => m.name.toLowerCase().includes(search));
  members.sort((a, b) => a.name.localeCompare(b.name, 'es'));

  const container = document.getElementById('participantsList');
  if (!container) return;

  if (!members.length) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">👥</div>
      <h3>Sin participantes</h3>
      <p>Agrega miembros con la etiqueta de este ministerio</p>
    </div>`;
    return;
  }

  container.innerHTML = members.map(m => {
    const age = calcAge(m.birth);
    return `
      <div class="list-item">
        <div class="avatar">${initials(m.name)}</div>
        <div class="item-info">
          <div class="item-name">${m.name}</div>
          <div class="item-sub">${age !== null ? age + ' años' : ''}${m.phone ? ' · ' + m.phone : ''}</div>
        </div>
      </div>`;
  }).join('');
}

// ===== REUNIONES =====
function renderMeetings() {
  const meetings = DB.get('meetings', [])
    .filter(m => m.ministryId === activeMinistryId)
    .sort((a, b) => a.date.localeCompare(b.date));

  const today    = new Date().toISOString().split('T')[0];
  const upcoming = meetings.filter(m => m.date >= today);
  const past     = meetings.filter(m => m.date <  today).reverse();

  renderMeetingList('upcomingMeetingsList', upcoming, true);
  renderMeetingList('pastMeetingsList',     past,     false);
}

function renderMeetingList(containerId, meetings, isUpcoming) {
  const container = document.getElementById(containerId);
  if (!meetings.length) {
    container.innerHTML = `<div style="color:var(--text-muted);font-size:13px;padding:12px 0;text-align:center;">
      ${isUpcoming ? 'No hay reuniones programadas' : 'Sin historial'}
    </div>`;
    return;
  }

  container.innerHTML = meetings.map(meet => {
    const taskCount = DB.get('tasks', []).filter(t => t.ministryId === activeMinistryId && t.meetingId === meet.id).length;
    const att       = DB.get('attendance_' + activeMinistryId + '_' + meet.id, null);
    const attCount  = att ? Object.values(att).filter(v => v === true).length : null;

    return `
      <div class="card clickable" onclick="openMeetingDetail('${meet.id}')">
        <div style="display:flex; align-items:flex-start; gap:8px;">
          <div style="flex:1;">
            <div style="font-weight:700; color:var(--text); margin-bottom:4px;">${meet.title}</div>
            <div style="font-size:12px; color:var(--text-muted);">
              📅 ${fmtDate(meet.date)}${meet.time ? ' · ' + meet.time : ''}
              ${meet.place ? ' · 📍 ' + meet.place : ''}
            </div>
            ${meet.desc ? `<div style="font-size:12px;color:var(--text-muted);margin-top:4px;">${meet.desc}</div>` : ''}
            <div style="display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;">
              ${taskCount > 0    ? `<span class="tag tag-gold">✅ ${taskCount} tarea${taskCount !== 1 ? 's' : ''}</span>` : ''}
              ${attCount !== null ? `<span class="tag tag-green">👥 ${attCount} presentes</span>` : ''}
              ${attCount === null ? `<span class="tag tag-gray">Sin asistencia</span>` : ''}
            </div>
          </div>
          <div style="color:var(--gold);font-size:20px;align-self:center;">›</div>
        </div>
      </div>`;
  }).join('');
}

// ===== DETALLE DE REUNIÓN =====
function openMeetingDetail(meetingId) {
  currentDetailMeetingId = meetingId;
  const meet = DB.get('meetings', []).find(m => m.id === meetingId);
  if (!meet) return;

  // Encabezado
  document.getElementById('mdHeader').innerHTML = `
    <div style="font-size:19px; font-weight:800; color:var(--text); margin-bottom:4px;">${meet.title}</div>
    <div style="font-size:13px; color:var(--text-muted);">
      📅 ${fmtDate(meet.date)}${meet.time ? ' · ' + meet.time : ''}
      ${meet.place ? ' · 📍 ' + meet.place : ''}
    </div>`;

  // Tarjetas resumen en Info
  const taskCount = DB.get('tasks', []).filter(t => t.ministryId === activeMinistryId && t.meetingId === meetingId).length;
  const att       = DB.get('attendance_' + activeMinistryId + '_' + meetingId, null);
  const attCount  = att ? Object.values(att).filter(v => v === true).length : null;
  const total     = getMinistryMembers().length;

  document.getElementById('mdtInfo').innerHTML = `
    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;">
      <div class="card" style="flex:1; min-width:80px; text-align:center; padding:12px 6px;">
        <div style="font-size:22px; font-weight:800; color:var(--gold);">${total}</div>
        <div style="font-size:11px; color:var(--text-muted);">participantes</div>
      </div>
      <div class="card" style="flex:1; min-width:80px; text-align:center; padding:12px 6px;">
        <div style="font-size:22px; font-weight:800; color:${attCount !== null ? 'var(--green)' : 'var(--text-muted)'};">
          ${attCount !== null ? attCount : '—'}
        </div>
        <div style="font-size:11px; color:var(--text-muted);">presentes</div>
      </div>
      <div class="card" style="flex:1; min-width:80px; text-align:center; padding:12px 6px;">
        <div style="font-size:22px; font-weight:800; color:var(--blue);">${taskCount}</div>
        <div style="font-size:11px; color:var(--text-muted);">tareas</div>
      </div>
    </div>
    ${meet.desc ? `<div class="card" style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">📝 ${meet.desc}</div>` : ''}
    <button class="btn btn-primary btn-block" onclick="switchDetailTab('attendance')">
      📋 Tomar asistencia
    </button>`;

  // Botón editar (director)
  document.getElementById('mdEditBtn').style.display = isDirectorOf(activeMinistryId) ? 'block' : 'none';

  // Preparar asistencia
  _initMdAttendance(meetingId);

  // Preparar tareas
  renderDetailTasks(meetingId);

  // Mostrar info primero
  switchDetailTab('info');
  openModal('meetingDetailModal');
}

function switchDetailTab(tab) {
  ['info', 'attendance', 'dtasks'].forEach(t => {
    // mapeo id del botón
    const btnId = t === 'dtasks' ? 'mdt-dtasks' : 'mdt-' + t;
    document.getElementById(btnId).classList.toggle('active', t === tab);
    // mapeo id del panel
    const panelId = 'mdt' + t.charAt(0).toUpperCase() + t.slice(1);
    document.getElementById(panelId).style.display = t === tab ? 'block' : 'none';
  });
  activeDetailTab = tab;
}

// ── Asistencia dentro del detalle ────────────────────────────────
function _initMdAttendance(meetingId) {
  const members = getMinistryMembers();
  tempAttendance = {};
  members.forEach(m => tempAttendance[m.id] = null);
  const saved = DB.get('attendance_' + activeMinistryId + '_' + meetingId, {});
  Object.assign(tempAttendance, saved);
  mdAttFilter = 'all';
  if (document.getElementById('mdAttSearch')) document.getElementById('mdAttSearch').value = '';
  renderDetailAttendance();
}

function setMdAttFilter(f) {
  mdAttFilter = 'all';
  renderDetailAttendance();
}

function renderDetailAttendance() {
  let members = getMinistryMembers();
  const search = (document.getElementById('mdAttSearch')?.value || '').toLowerCase();
  if (search) members = members.filter(m => m.name.toLowerCase().includes(search));

  members.sort((a, b) => {
    const sa = tempAttendance[a.id], sb = tempAttendance[b.id];
    if (sa === sb) return a.name.localeCompare(b.name, 'es');
    if (sa === true) return -1; if (sb === true) return 1;
    return 0;
  });

  const total   = members.length;
  const present = members.filter(m => tempAttendance[m.id] === true).length;
  const absent  = members.filter(m => tempAttendance[m.id] === false).length;
  const pct     = total > 0 ? Math.round(present / total * 100) : 0;

  document.getElementById('mdAttStats').innerHTML = `
    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
      <span style="font-size:12px; color:var(--text-muted);">
        <span style="color:var(--green);font-weight:700;">${present}</span> presentes ·
        <span style="color:var(--red);font-weight:700;">${absent}</span> ausentes ·
        ${total - present - absent} sin marcar
      </span>
      <span style="font-size:12px; font-family:'Cinzel',serif; color:var(--gold); font-weight:700;">${pct}%</span>
    </div>
    <div class="attendance-bar"><div class="bar-fill" style="width:${pct}%"></div></div>`;

  const container = document.getElementById('mdAttList');
  if (!members.length) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">👤</div><h3>Sin participantes</h3>
      <p>Agrega miembros con etiqueta de este ministerio</p>
    </div>`;
    return;
  }

  container.innerHTML = members.map(m => {
    const state      = tempAttendance[m.id];
    const isPresent  = state === true;
    const isAbsent   = state === false;
    const age        = calcAge(m.birth);
    return `
      <div class="check-item ${isPresent ? 'checked' : isAbsent ? 'absent' : ''}"
           onclick="toggleMdAttendance('${m.id}')">
        <div class="check-box">${isPresent ? '✓' : isAbsent ? '✗' : ''}</div>
        <div class="item-info">
          <div class="item-name">${m.name}</div>
          <div class="item-sub">${age !== null ? age + ' años' : ''}${m.phone ? ' · ' + m.phone : ''}</div>
        </div>
      </div>`;
  }).join('');
}

function toggleMdAttendance(id) {
  const cur = tempAttendance[id];
  if (cur === null || cur === undefined) tempAttendance[id] = true;
  else if (cur === true) tempAttendance[id] = false;
  else tempAttendance[id] = null;
  renderDetailAttendance();
}

function mdMarkAll(present) {
  getMinistryMembers().forEach(m => tempAttendance[m.id] = present);
  renderDetailAttendance();
}

function saveMeetingAttendance() {
  DB.set('attendance_' + activeMinistryId + '_' + currentDetailMeetingId, tempAttendance);
  const present = Object.values(tempAttendance).filter(v => v === true).length;
  showToast('✅ Asistencia guardada · ' + present + ' presentes', 'success');
  renderMeetings(); // refresca el tag en la tarjeta
}

// ── Tareas del detalle ───────────────────────────────────────────
function renderDetailTasks(meetingId) {
  const tasks     = DB.get('tasks', []).filter(t => t.ministryId === activeMinistryId && t.meetingId === meetingId);
  const container = document.getElementById('mdTasksList');

  if (!tasks.length) {
    container.innerHTML = `<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:16px 0;">
      Sin tareas para esta reunión
    </div>`;
    return;
  }

  container.innerHTML = tasks.map(task => `
    <div class="task-item ${task.done ? 'done' : ''}">
      <div class="task-check"
           onclick="toggleTaskAndRefreshDetail('${task.id}', '${meetingId}')">
        ${task.done ? '✓' : ''}
      </div>
      <div class="task-info">
        <div class="task-name">${task.title}</div>
        <div class="task-meta">
          ${task.assigned ? '👤 ' + task.assigned : ''}
          ${task.dueDate  ? (task.assigned ? ' · ' : '') + '⏰ ' + fmtDate(task.dueDate) : ''}
        </div>
        ${task.notes ? `<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${task.notes}</div>` : ''}
      </div>
      <button class="btn btn-sm btn-ghost" style="padding:6px 8px;"
              onclick="requireDirector(() => openEditTask('${task.id}'))">✏️</button>
    </div>`).join('');
}

function toggleTaskAndRefreshDetail(taskId, meetingId) {
  let tasks = DB.get('tasks', []);
  const idx = tasks.findIndex(t => t.id === taskId);
  if (idx >= 0) tasks[idx].done = !tasks[idx].done;
  DB.set('tasks', tasks);
  renderDetailTasks(meetingId);
  renderTasks();
}

// ===== CRUD REUNIONES =====
function openAddMeeting() {
  editingMeetingId = null;
  document.getElementById('meetingModalTitle').textContent = 'Nueva Reunión';
  document.getElementById('mTitle').value = '';
  document.getElementById('mDate').value  = new Date().toISOString().split('T')[0];
  document.getElementById('mTime').value  = '';
  document.getElementById('mPlace').value = '';
  document.getElementById('mDesc').value  = '';
  document.getElementById('deleteMeetingBtn').style.display = 'none';
  openModal('meetingModal');
}

function openEditMeeting(id) {
  const meet = DB.get('meetings', []).find(m => m.id === id);
  if (!meet) return;
  editingMeetingId = id;
  document.getElementById('meetingModalTitle').textContent = 'Editar Reunión';
  document.getElementById('mTitle').value = meet.title || '';
  document.getElementById('mDate').value  = meet.date  || '';
  document.getElementById('mTime').value  = meet.time  || '';
  document.getElementById('mPlace').value = meet.place || '';
  document.getElementById('mDesc').value  = meet.desc  || '';
  document.getElementById('deleteMeetingBtn').style.display = 'block';
  openModal('meetingModal');
}

function saveMeeting() {
  const title = document.getElementById('mTitle').value.trim();
  const date  = document.getElementById('mDate').value;
  if (!title || !date) { showToast('Título y fecha requeridos', 'error'); return; }

  let meetings = DB.get('meetings', []);
  const data   = {
    title, date,
    time:       document.getElementById('mTime').value,
    place:      document.getElementById('mPlace').value.trim(),
    desc:       document.getElementById('mDesc').value.trim(),
    ministryId: activeMinistryId
  };

  if (editingMeetingId) {
    const idx = meetings.findIndex(m => m.id === editingMeetingId);
    if (idx >= 0) meetings[idx] = { ...meetings[idx], ...data };
  } else {
    data.id = genId(); data.createdAt = Date.now();
    meetings.push(data);
  }

  DB.set('meetings', meetings);
  closeModal('meetingModal');
  showToast(editingMeetingId ? '✅ Reunión actualizada' : '✅ Reunión creada', 'success');
  renderMeetings();
}

function deleteMeeting() {
  if (!confirm('¿Eliminar esta reunión?')) return;
  DB.set('meetings', DB.get('meetings', []).filter(m => m.id !== editingMeetingId));
  closeModal('meetingModal');
  showToast('Reunión eliminada', 'error');
  renderMeetings();
}

// ===== CRUD TAREAS =====
function renderTasks() {
  let tasks  = DB.get('tasks', []).filter(t => t.ministryId === activeMinistryId);
  const meets = DB.get('meetings', []).filter(m => m.ministryId === activeMinistryId);

  if (taskFilter === 'pending') tasks = tasks.filter(t => !t.done);
  if (taskFilter === 'done')    tasks = tasks.filter(t =>  t.done);
  if (taskFilter === 'free')    tasks = tasks.filter(t => !t.meetingId);

  tasks.sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
    return 0;
  });

  const container = document.getElementById('tasksList');
  if (!tasks.length) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">✅</div><h3>Sin tareas</h3>
      <p>Usa el botón + para agregar</p>
    </div>`;
    return;
  }

  container.innerHTML = tasks.map(task => {
    const meet = task.meetingId ? meets.find(m => m.id === task.meetingId) : null;
    return `
      <div class="task-item ${task.done ? 'done' : ''}">
        <div class="task-check" onclick="toggleTask('${task.id}')">
          ${task.done ? '✓' : ''}
        </div>
        <div class="task-info">
          <div class="task-name">${task.title}</div>
          <div class="task-meta">
            ${task.assigned ? '👤 ' + task.assigned + ' · ' : ''}
            ${meet ? '📅 ' + fmtDate(meet.date) : '<span style="color:var(--text-dim)">Sin reunión específica</span>'}
            ${task.dueDate ? ' · ⏰ ' + fmtDate(task.dueDate) : ''}
          </div>
          ${task.notes ? `<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${task.notes}</div>` : ''}
        </div>
        <button class="btn btn-sm btn-ghost" style="padding:6px 8px;"
                onclick="requireDirector(() => openEditTask('${task.id}'))">✏️</button>
      </div>`;
  }).join('');
}

function setTaskFilter(f) {
  taskFilter = f;
  ['all','pending','free','done'].forEach(x =>
    document.getElementById('tf-' + x).classList.toggle('active', x === f)
  );
  renderTasks();
}

function toggleTask(id) {
  let tasks = DB.get('tasks', []);
  const idx = tasks.findIndex(t => t.id === id);
  if (idx >= 0) tasks[idx].done = !tasks[idx].done;
  DB.set('tasks', tasks);
  renderTasks();
}

function openAddTask() {
  editingTaskId = null;
  document.getElementById('taskModalTitle').textContent = 'Nueva Tarea';
  ['tTitle','tAssigned','tDue','tNotes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('deleteTaskBtn').style.display = 'none';
  _populateTaskMeetingSelect(null);
  openModal('taskModal');
}

function openAddTaskForMeeting(meetingId) {
  editingTaskId = null;
  document.getElementById('taskModalTitle').textContent = 'Nueva Tarea';
  ['tTitle','tAssigned','tDue','tNotes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('deleteTaskBtn').style.display = 'none';
  _populateTaskMeetingSelect(meetingId);
  openModal('taskModal');
}

function openEditTask(id) {
  const task = DB.get('tasks', []).find(t => t.id === id);
  if (!task) return;
  editingTaskId = id;
  document.getElementById('taskModalTitle').textContent = 'Editar Tarea';
  document.getElementById('tTitle').value    = task.title    || '';
  document.getElementById('tAssigned').value = task.assigned || '';
  document.getElementById('tDue').value      = task.dueDate  || '';
  document.getElementById('tNotes').value    = task.notes    || '';
  document.getElementById('deleteTaskBtn').style.display = 'block';
  _populateTaskMeetingSelect(task.meetingId || null);
  openModal('taskModal');
}

function _populateTaskMeetingSelect(selectedId) {
  const meetings = DB.get('meetings', [])
    .filter(m => m.ministryId === activeMinistryId)
    .sort((a, b) => a.date.localeCompare(b.date));
  document.getElementById('tMeeting').innerHTML =
    '<option value="">Sin reunión específica</option>' +
    meetings.map(m =>
      `<option value="${m.id}" ${selectedId === m.id ? 'selected' : ''}>${m.title} (${fmtDate(m.date)})</option>`
    ).join('');
}

function saveTask() {
  const title = document.getElementById('tTitle').value.trim();
  if (!title) { showToast('El título es requerido', 'error'); return; }

  let tasks = DB.get('tasks', []);
  const data = {
    title,
    assigned:   document.getElementById('tAssigned').value.trim(),
    meetingId:  document.getElementById('tMeeting').value  || null,
    dueDate:    document.getElementById('tDue').value      || null,
    notes:      document.getElementById('tNotes').value.trim(),
    ministryId: activeMinistryId,
    done:       false
  };

  if (editingTaskId) {
    const idx = tasks.findIndex(t => t.id === editingTaskId);
    if (idx >= 0) tasks[idx] = { ...tasks[idx], ...data, done: tasks[idx].done };
  } else {
    data.id = genId(); data.createdAt = Date.now();
    tasks.push(data);
  }

  DB.set('tasks', tasks);
  closeModal('taskModal');
  showToast(editingTaskId ? '✅ Tarea actualizada' : '✅ Tarea creada', 'success');
  renderTasks();
  if (currentDetailMeetingId && data.meetingId === currentDetailMeetingId)
    renderDetailTasks(currentDetailMeetingId);
}

function deleteTask() {
  if (!confirm('¿Eliminar esta tarea?')) return;
  DB.set('tasks', DB.get('tasks', []).filter(t => t.id !== editingTaskId));
  closeModal('taskModal');
  showToast('Tarea eliminada', 'error');
  renderTasks();
  if (currentDetailMeetingId) renderDetailTasks(currentDetailMeetingId);
}
</script>
</body>
